# Itens 18 e 19 para Nginx. Inclua dentro do bloco `server` do site.
#
# EDITE: troque https://SUA-API.exemplo.com no connect-src pelo domínio real da API.

# ---- Item 19: forçar HTTPS --------------------------------------------------
# No bloco :80
#   return 308 https://$host$request_uri;
# 308 (não 301/302) preserva método e corpo — um POST redirecionado com 302 vira GET.

# ---- Item 18: cabeçalhos ----------------------------------------------------
# `always` faz o header sair também em respostas de erro (4xx/5xx), que é justamente
# onde uma página de erro do servidor poderia ser enquadrada ou sniffada.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://SUA-API.exemplo.com; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# ---- Item 17: não anunciar a stack ------------------------------------------
server_tokens off;

# ---- Itens 1, 2: nunca servir dotfile, backup ou dump -----------------------
location ~ /\. { deny all; }
location ~* \.(env|bak|old|orig|log|sql|sqlite3?)$ { deny all; }

# ---- Item 11: rate limit na borda -------------------------------------------
# No bloco `http`:
#   limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# E no location do login:
#   limit_req zone=login burst=3 nodelay;
