# Item 20 — atualizações automáticas de dependências.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    groups:
      # Um PR por semana para atualizações de rotina, e PRs individuais para as de
      # segurança — que precisam ser revisadas e mergeadas rápido.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
