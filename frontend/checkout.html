<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamento — Instagram Analytics</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="container">
  <div class="card" style="text-align:center">
    <h1>Pagamento via Pix</h1>
    <p>Escaneie o QR Code abaixo com o app do seu banco.</p>
    <div id="loading" style="padding:40px;color:var(--muted)">Gerando QR Code...</div>
    <div id="qr-block" style="display:none">
      <img id="qr-img" src="" alt="QR Code Pix" style="max-width:220px;border-radius:12px;margin:16px auto;display:block">
      <p id="price-label" style="font-size:1.5rem;font-weight:800;color:var(--green)"></p>
      <p style="font-size:0.85rem">Expira em <span id="timer">15:00</span></p>
      <p style="font-size:0.8rem;margin-top:8px">Pix copia e cola:</p>
      <textarea id="br-code" readonly style="font-size:0.72rem;height:60px"></textarea>
    </div>
    <div id="expired-msg" style="display:none;color:#f87171">QR Code expirado.
      <button type="button" id="reload-btn" class="btn" style="width:auto;padding:8px 16px;margin-left:8px">Gerar novo</button>
    </div>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/flow.js"></script>
<script src="assets/page-checkout.js"></script>
</body>
</html>
